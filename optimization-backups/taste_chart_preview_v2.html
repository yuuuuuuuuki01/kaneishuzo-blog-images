<h2>白笹鼓 本醸造</h2>
<p>「白笹鼓 本醸造」は、神奈川県秦野市の金井酒造店が、環境省「全国名水百選」に選ばれた丹沢山系の伏流水で醸す本醸造酒です。<br>精米歩合65%・アルコール度数15度。</p>
<p>さらりとした口当たりとキレを感じて頂ける商品。<br>焼き魚、焼き鳥（塩）等のお料理を受け止めながらも、さっぱりと楽しませてくれます。<br>四季を通してお好みにあわせた飲み方が楽しめます。</p>
