<!doctype html><meta charset="utf-8">
<body style="font-family:sans-serif;max-width:520px;margin:24px auto;color:#222;line-height:1.7;">
<h2>白笹鼓 本醸造（ブランドカラー #6594a0 / 開始位置そろえ）</h2>
<div style="max-width:460px;margin:8px 0;font-size:13px;color:#333;">
<div style="display:flex;align-items:center;margin:7px 0;"><span style="flex:0 0 64px;white-space:nowrap;color:#777;margin-right:8px;">甘口</span><span style="flex:1 1 auto;min-width:60px;height:10px;background:#e9eef0;border-radius:5px;"><span style="display:block;height:10px;width:80%;background:#6594a0;border-radius:5px;"></span></span><span style="flex:0 0 78px;white-space:nowrap;color:#777;margin-left:8px;">辛口 <strong style="color:#333;">4/5</strong></span></div>
<div style="display:flex;align-items:center;margin:7px 0;"><span style="flex:0 0 64px;white-space:nowrap;color:#777;margin-right:8px;">淡麗</span><span style="flex:1 1 auto;min-width:60px;height:10px;background:#e9eef0;border-radius:5px;"><span style="display:block;height:10px;width:40%;background:#6594a0;border-radius:5px;"></span></span><span style="flex:0 0 78px;white-space:nowrap;color:#777;margin-left:8px;">濃醇 <strong style="color:#333;">2/5</strong></span></div>
<div style="display:flex;align-items:center;margin:7px 0;"><span style="flex:0 0 64px;white-space:nowrap;color:#777;margin-right:8px;">穏やか</span><span style="flex:1 1 auto;min-width:60px;height:10px;background:#e9eef0;border-radius:5px;"><span style="display:block;height:10px;width:40%;background:#6594a0;border-radius:5px;"></span></span><span style="flex:0 0 78px;white-space:nowrap;color:#777;margin-left:8px;">華やか <strong style="color:#333;">2/5</strong></span></div>
<div style="display:flex;align-items:center;margin:7px 0;"><span style="flex:0 0 64px;white-space:nowrap;color:#777;margin-right:8px;">おだやか</span><span style="flex:1 1 auto;min-width:60px;height:10px;background:#e9eef0;border-radius:5px;"><span style="display:block;height:10px;width:60%;background:#6594a0;border-radius:5px;"></span></span><span style="flex:0 0 78px;white-space:nowrap;color:#777;margin-left:8px;">酸味 <strong style="color:#333;">3/5</strong></span></div>
<div style="display:flex;align-items:center;margin:7px 0;"><span style="flex:0 0 64px;white-space:nowrap;color:#777;margin-right:8px;">まろやか</span><span style="flex:1 1 auto;min-width:60px;height:10px;background:#e9eef0;border-radius:5px;"><span style="display:block;height:10px;width:100%;background:#6594a0;border-radius:5px;"></span></span><span style="flex:0 0 78px;white-space:nowrap;color:#777;margin-left:8px;">キレ <strong style="color:#333;">5/5</strong></span></div>
</div>
<p style="font-size:12px;color:#888;">※左ラベルを固定幅(64px)にしたので、全行のバー開始位置がそろいます。</p>
</body>
